<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Task-Tracker with Time Tokens</title>

  <link rel="stylesheet" href="css/task-tracker.css">
</head>

<body>
  <header>
    <h1>Task Tracker (Ŧ / ₱ Edition)</h1>

    <nav>
      <a href="index.html">Home</a>
      <a href="#">Tasks</a>

      <button id="login" style="margin-left:20px">
        🔒 Log in to sync
      </button>

      <span
        id="login-status"
        style="margin-left:8px;font-weight:bold;color:#555"
      >
        (offline)
      </span>
    </nav>
  </header>

  <main>
    <div id="token-week-wrapper">
      <span id="token-week-text">Ŧ Used: 0 / 0</span>

      <div class="token-week-bar">
        <div
          id="token-week-fill"
          class="token-week-fill"
        ></div>

        <div
          id="token-week-label"
          class="token-week-label"
        >
          0 %
        </div>
      </div>
    </div>

    <div style="margin-top:10px;font-weight:bold;text-align:center;">
      Current Points (₱):
      <span id="points-current">0</span>
      |
      Earned:
      <span id="points-earned">0</span>
      |
      Spent:
      <span id="points-spent">0</span>
    </div>

    <div class="flex mt10">
      <button onclick="changeMonth(-1)">
        &#8249;
      </button>

      <h3
        id="calendar-month-year"
        style="flex:1;text-align:center"
      ></h3>

      <button onclick="changeMonth(1)">
        &#8250;
      </button>
    </div>

    <div id="calendar"></div>

    <h4>
      Date:
      <span id="date-today"></span>
    </h4>

    <div id="task-sections">
      <div id="daily-section">
        <h3>Daily Tasks</h3>
        <table id="task-table"></table>
      </div>

      <div id="weekly-section">
        <h3 id="weekly-header">Weekly Tasks</h3>
        <table id="weekly-task-table"></table>
      </div>
    </div>

    <div
      id="progress-container"
      class="mt10"
    ></div>

    <div class="form-block">
      <h3>Add Task</h3>

      <input
        id="new-task-desc"
        type="text"
        placeholder="Task description"
      >

      <select
        id="new-task-scope"
        title="Scope"
      >
        <option value="daily">Daily</option>
        <option value="weekly">Weekly</option>
      </select>

      <select
        id="new-task-signif"
        title="Significance / tokens"
      >
        <option value="daily">daily (0.2 Ŧ/h)</option>
        <option value="minor">minor (0.5 Ŧ/h)</option>
        <option value="major">major (1 Ŧ/h)</option>
        <option value="massive">massive (2 Ŧ/h)</option>
      </select>

      <select
        id="new-task-cat"
        title="Category"
      ></select>

      <button onclick="addTask()">
        Add
      </button>
    </div>

    <div class="form-block flex">
      <div style="flex:1">
        <h3>Add Category</h3>

        <input
          id="new-cat-name"
          type="text"
          placeholder="Category"
        >

        <button onclick="addCategory()">
          Add
        </button>
      </div>

      <div style="flex:1">
        <h3>Remove Category</h3>

        <select id="remove-cat-select"></select>

        <button onclick="removeCategory()">
          Delete
        </button>
      </div>
    </div>

    <div class="form-block">
      <h3 id="shop-title">
        Reward Shop (Choose category)
      </h3>

      <select
        id="shop-cat-select"
        onchange="renderShop()"
      ></select>

      <div
        id="shop-list"
        class="mt10"
      ></div>

      <h4 class="mt10">
        Add Reward to Category
      </h4>

      <input
        id="new-reward-desc"
        type="text"
        placeholder="Description"
      >

      <input
        id="new-reward-cost"
        type="number"
        min="1"
        style="width:80px"
        placeholder="₱"
      >

      <button onclick="addReward()">
        Add Reward
      </button>
    </div>

    <div class="form-block">
      <h3>Settings</h3>

      Weekly Ŧ Trove:

      <input
        id="weekly-tokens-input"
        type="number"
        style="width:80px"
      >

      <button onclick="updateSettings()">
        Save
      </button>
    </div>

    <div class="form-block">
      <button
        onclick="clearAllData()"
        style="background:#d9534f;color:#fff"
      >
        Clear ALL local data
      </button>
    </div>

    <div class="form-block">
      <button onclick="saveBackup()">
        Save Backup
      </button>

      <input
        type="file"
        id="loadBackup"
        onchange="loadBackup(event)"
        style="display:none;"
      >

      <button
        onclick="document.getElementById('loadBackup').click()"
      >
        Load Backup
      </button>
    </div>
  </main>

  <footer style="text-align:center;margin-top:30px">
    © 2025 Christian Kohnle
  </footer>

  <script
    type="module"
    src="js/tracker-main.js"
  ></script>
</body>
</html>
